# Builds the reviewer image and pushes it to GitHub Container Registry.
# ReviewBench references an image by digest; the run summary shows the digest to register.
# Each image is also tagged with scripts/image-tag.sh, which action.yml pulls so a review skips the build.
name: Build and push
on:
  push:
    branches: [main]
  workflow_dispatch: {}
# id-token and attestations let the build sign a record of which commit and workflow built the image.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "content=$(bash scripts/image-tag.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rev-engine-prime:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rev-engine-prime:${{ steps.tag.outputs.content }}
      # action.yml checks this record before it runs a pulled image, so an image that this
      # workflow did not build from main is never given a repository's code or keys.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rev-engine-prime
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: echo "ghcr.io/${{ github.repository_owner }}/rev-engine-prime@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
