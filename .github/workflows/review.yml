# Reviews a pull request in this repository with RevEngine itself.
# A person with write access comments /review on a pull request, or runs this workflow with a pull request number.
name: Review
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && (startsWith(github.event.comment.body, '/review ') || github.event.comment.body == '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: laude-institute/rev-engine@main
        with:
          model-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model-base-url: https://openrouter.ai/api/v1
          model-extra-body: '{"usage":{"include":true}}'
          model-extra-body-by-model: '{"anthropic/":{"cache_control":{"type":"ephemeral"}}}'
          pr-number: ${{ inputs.pr-number }}
          allow-forks: "true"
