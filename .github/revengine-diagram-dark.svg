<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1240" height="400" fill="#0d1117"/>

  <!-- Inputs -->
  <text x="30" y="58" font-size="15" font-weight="600" fill="#8b949e">INPUTS</text>
  <rect x="30" y="94" width="200" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="124" font-size="15" text-anchor="middle" fill="#e6edf3">Pull request</text>
  <rect x="30" y="154" width="200" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="184" font-size="15" text-anchor="middle" fill="#e6edf3">Repository checkout</text>
  <rect x="30" y="214" width="200" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="244" font-size="15" text-anchor="middle" fill="#e6edf3">Project rules and docs</text>

  <path d="M230,119 L252,119 L252,239 L230,239 M230,179 L282,179" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <rect x="290" y="74" width="210" height="210" rx="10" fill="#0f1f38" stroke="#3b82f6" stroke-width="2"/>
  <text x="395" y="108" font-size="13" font-weight="600" text-anchor="middle" fill="#60a5fa">STEP 1</text>
  <text x="395" y="134" font-size="19" font-weight="600" text-anchor="middle" fill="#e6edf3">Review</text>
  <text x="395" y="170" font-size="14" text-anchor="middle" fill="#c9d1d9">A strong model reads</text>
  <text x="395" y="190" font-size="14" text-anchor="middle" fill="#c9d1d9">the code with read-only</text>
  <text x="395" y="210" font-size="14" text-anchor="middle" fill="#c9d1d9">tools and submits</text>
  <text x="395" y="230" font-size="14" text-anchor="middle" fill="#c9d1d9">findings</text>

  <line x1="500" y1="179" x2="542" y2="179" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="550" y="74" width="210" height="210" rx="10" fill="#0d2618" stroke="#22c55e" stroke-width="2"/>
  <text x="655" y="108" font-size="13" font-weight="600" text-anchor="middle" fill="#4ade80">STEP 2</text>
  <text x="655" y="134" font-size="19" font-weight="600" text-anchor="middle" fill="#e6edf3">Verify</text>
  <text x="655" y="170" font-size="14" text-anchor="middle" fill="#c9d1d9">A second pass rechecks</text>
  <text x="655" y="190" font-size="14" text-anchor="middle" fill="#c9d1d9">each finding against</text>
  <text x="655" y="210" font-size="14" text-anchor="middle" fill="#c9d1d9">the code and drops</text>
  <text x="655" y="230" font-size="14" text-anchor="middle" fill="#c9d1d9">wrong or unsupported ones</text>

  <line x1="760" y1="179" x2="802" y2="179" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="810" y="74" width="210" height="210" rx="10" fill="#262010" stroke="#eab308" stroke-width="2"/>
  <text x="915" y="108" font-size="13" font-weight="600" text-anchor="middle" fill="#facc15">STEP 3</text>
  <text x="915" y="134" font-size="19" font-weight="600" text-anchor="middle" fill="#e6edf3">Rank</text>
  <text x="915" y="170" font-size="14" text-anchor="middle" fill="#c9d1d9">Remove duplicates</text>
  <text x="915" y="190" font-size="14" text-anchor="middle" fill="#c9d1d9">and rank findings</text>
  <text x="915" y="210" font-size="14" text-anchor="middle" fill="#c9d1d9">by severity and</text>
  <text x="915" y="230" font-size="14" text-anchor="middle" fill="#c9d1d9">confidence</text>

  <line x1="1020" y1="179" x2="1062" y2="179" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <text x="1070" y="58" font-size="15" font-weight="600" fill="#8b949e">OUTPUT</text>
  <rect x="1070" y="134" width="150" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="1145" y="168" font-size="15" text-anchor="middle" fill="#e6edf3">Review on</text>
  <text x="1145" y="189" font-size="15" text-anchor="middle" fill="#e6edf3">the pull request</text>
  <text x="1145" y="210" font-size="12" text-anchor="middle" fill="#8b949e">via GitHub Action</text>

  <!-- Footer -->
  <text x="620" y="345" font-size="15" text-anchor="middle" fill="#8b949e">With Claude Opus 5.5, a typical review takes about 3 minutes and costs about $1 in tokens.</text>
</svg>
